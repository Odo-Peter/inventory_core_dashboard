name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Skip installing git hooks (the "prepare" script runs husky on npm ci).
      HUSKY: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # continue-on-error lets every check run and report, even when an
      # earlier one fails. The final "Fail job" step enforces the result.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          npm run test:coverage -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=junit.xml \
            --coverage.reportOnFailure

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment results on PR
        if: >-
          ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');

            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- inventory-dashboard-ci-results -->';

            const getAttr = (attrs, name) => {
              const match = attrs.match(
                new RegExp(`(?:^|\\s)${name}="(\\d+)"`)
              );
              return match ? Number(match[1]) : null;
            };

            // Returns { total, failures, errors, skipped }, or null if the
            // report is missing or unreadable.
            const parseJunit = (path) => {
              if (!fs.existsSync(path)) return null;
              const xml = fs.readFileSync(path, 'utf8');

              let total = 0;
              let failures = 0;
              let errors = 0;

              const root = xml.match(/<testsuites\b([^>]*)>/);
              const rootTotal = root ? getAttr(root[1], 'tests') : null;

              if (rootTotal !== null) {
                total = rootTotal;
                failures = getAttr(root[1], 'failures') ?? 0;
                errors = getAttr(root[1], 'errors') ?? 0;
              } else {
                const suites = [...xml.matchAll(/<testsuite\b([^>]*)>/g)];
                if (suites.length === 0) return null;
                for (const suite of suites) {
                  total += getAttr(suite[1], 'tests') ?? 0;
                  failures += getAttr(suite[1], 'failures') ?? 0;
                  errors += getAttr(suite[1], 'errors') ?? 0;
                }
              }

              // Skipped tests are emitted as <skipped/> children.
              const skipped = (xml.match(/<skipped\b/g) || []).length;

              return { total, failures, errors, skipped };
            };

            // Overall line coverage from lcov (sum of LF / LH records).
            const parseLineCoverage = (path) => {
              if (!fs.existsSync(path)) return null;
              let found = 0;
              let hit = 0;
              for (const line of fs.readFileSync(path, 'utf8').split('\n')) {
                if (line.startsWith('LF:')) found += Number(line.slice(3));
                else if (line.startsWith('LH:')) hit += Number(line.slice(3));
              }
              return found > 0 ? ((hit / found) * 100).toFixed(1) : null;
            };

            const statusLabel = (outcome) => {
              switch (outcome) {
                case 'success': return 'Passed';
                case 'failure': return 'Failed';
                case 'cancelled': return 'Cancelled';
                default: return 'Not run';
              }
            };

            const checks = [
              { label: 'Type check', outcome: process.env.TYPECHECK_OUTCOME },
              { label: 'Lint', outcome: process.env.LINT_OUTCOME },
              { label: 'Formatting', outcome: process.env.FORMAT_OUTCOME },
              { label: 'Tests', outcome: process.env.TEST_OUTCOME },
              { label: 'Build', outcome: process.env.BUILD_OUTCOME },
            ];

            let summary = '## Frontend CI Results\n\n';

            if (process.env.INSTALL_OUTCOME === 'failure') {
              summary +=
                '### Dependency install failed\n\n' +
                'No checks could run. Check the workflow logs for the npm error.\n\n';
            }

            summary += '| Check | Status |\n|---|---|\n';
            for (const { label, outcome } of checks) {
              summary += `| ${label} | ${statusLabel(outcome)} |\n`;
            }
            summary += '\n';

            const tests = parseJunit('junit.xml');
            if (tests) {
              const passed = Math.max(
                0,
                tests.total - tests.failures - tests.errors - tests.skipped
              );
              summary += '| Tests | Count |\n|---|---:|\n';
              summary += `| Passed | ${passed} |\n`;
              summary += `| Failed | ${tests.failures} |\n`;
              summary += `| Errors | ${tests.errors} |\n`;
              summary += `| Skipped | ${tests.skipped} |\n`;
              summary += `| Total | ${tests.total} |\n\n`;
            }

            const coverage = parseLineCoverage('coverage/lcov.info');
            if (coverage !== null) {
              summary += `**Line coverage:** ${coverage}%\n\n`;
            }

            if (process.env.FORMAT_OUTCOME === 'failure') {
              summary += 'Formatting failed: run `npm run format` locally and commit the result.\n\n';
            }

            const allPassed = checks.every((c) => c.outcome === 'success');
            summary += allPassed
              ? '### All checks passed\n\n'
              : '### Some checks failed or did not run\n\n';

            summary += `[View workflow run, reports and coverage](${runUrl})`;
            summary = `${marker}\n${summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(
              (comment) =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: summary
              });
            }

      - name: Fail job if any check failed
        if: >-
          ${{ !cancelled() && (
          steps.typecheck.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure') }}
        run: |
          echo "One or more checks failed. See the steps above."
          exit 1
